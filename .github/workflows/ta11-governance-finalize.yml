name: TA-11 Governance Finalize

on:
  push:
    paths:
      - '.github/workflows/ta11-governance-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize TA-11 governance
        shell: python
        run: |
          import runpy
          runpy.run_path('.github/ta11_governance_finalize.py', run_name='__main__')

      - name: Review governance patch
        shell: bash
        run: git diff --stat

      - name: Commit governance handoff
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No governance changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/technical_architecture
          git commit -m "Finalize TA-11 architecture governance"
          git push origin HEAD:main
