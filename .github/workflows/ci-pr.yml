name: StarForge CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-unit:
    name: StarForge / Build & Unit
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify candidate SHA
        shell: pwsh
        run: |
          $expected = "${{ github.event.pull_request.head.sha || github.sha }}"
          $actual = git rev-parse HEAD
          Write-Host "candidate_sha=$actual"
          if ($actual -ne $expected) {
            throw "Checkout SHA mismatch: expected $expected, got $actual"
          }

      - name: Verify locked Visual Studio and MSVC toolset
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe was not found on the certification runner" }
          $vsPath = & $vswhere -latest -products * -version "[17.14,17.15)" -property installationPath
          $version = & $vswhere -latest -products * -version "[17.14,17.15)" -property installationVersion
          if (-not $vsPath -or -not $version) { throw "TA16-V1 requires a Visual Studio 2022 17.14 installation" }
          if ($version -ne "17.14.37614.0") { throw "TA16-V1 requires Visual Studio 2022 17.14.39 / installation 17.14.37614.0; runner has $version" }
          $msvcRoot = Join-Path $vsPath "VC\Tools\MSVC"
          $toolset = Get-ChildItem -Path $msvcRoot -Directory | Where-Object { $_.Name -like "14.44.*" } | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $toolset) { throw "TA16-V1 requires the MSVC v143 14.44 toolset family" }
          $cl = Join-Path $toolset.FullName "bin\Hostx64\x64\cl.exe"
          if (-not (Test-Path $cl)) { throw "Expected x64 cl.exe was not found at $cl" }
          Write-Host "visual_studio_installation_version=$version"
          Write-Host "msvc_toolset_directory=$($toolset.Name)"

      - name: Install and verify CMake 4.3.3
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "cmake-4.3.3-windows-x86_64.zip"
          $installRoot = Join-Path $env:RUNNER_TEMP "cmake-4.3.3"
          $url = "https://github.com/Kitware/CMake/releases/download/v4.3.3/cmake-4.3.3-windows-x86_64.zip"
          $expectedSha256 = "935ade9e5e8723583c07f44c5592cea2a1c8f65c56ca7e07b34c025c880e0bd6"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) { throw "CMake 4.3.3 archive SHA-256 mismatch" }
          Expand-Archive -Path $archive -DestinationPath $installRoot
          $cmakeBin = Join-Path $installRoot "cmake-4.3.3-windows-x86_64\bin"
          $cmakeExe = Join-Path $cmakeBin "cmake.exe"
          if ((& $cmakeExe --version | Select-Object -First 1) -ne "cmake version 4.3.3") { throw "TA16-V1 requires CMake 4.3.3" }
          $cmakeBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Bootstrap exact vcpkg baseline
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $root
          git -C $root checkout a1cae005c39be7b18ba319fced856b68d7276271
          $actual = git -C $root rev-parse HEAD
          if ($actual -ne "a1cae005c39be7b18ba319fced856b68d7276271") { throw "vcpkg baseline checkout mismatch" }
          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        shell: pwsh
        run: cmake --preset windows-msvc-debug

      - name: Build
        shell: pwsh
        run: cmake --build --preset windows-msvc-debug --parallel

      - name: Require nonzero unit-test discovery
        shell: pwsh
        run: >-
          cmake
          -DSTARFORGE_TEST_BUILD_DIR=${{ github.workspace }}/out/build/windows-msvc-debug
          -DSTARFORGE_TEST_LABEL=unit
          -DSTARFORGE_TEST_CONFIG=Debug
          -P cmake/RequireTests.cmake

      - name: Run unit tests
        shell: pwsh
        run: ctest --preset windows-unit

      - name: Run headless bootstrap executable
        shell: pwsh
        run: .\out\build\windows-msvc-debug\apps\headless\Debug\starforge-headless.exe --workers=1

  headless-determinism:
    name: StarForge / Headless Determinism
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify candidate SHA
        shell: pwsh
        run: |
          $expected = "${{ github.event.pull_request.head.sha || github.sha }}"
          $actual = git rev-parse HEAD
          if ($actual -ne $expected) { throw "Checkout SHA mismatch: expected $expected, got $actual" }

      - name: Verify locked Visual Studio and MSVC toolset
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe was not found on the certification runner" }
          $vsPath = & $vswhere -latest -products * -version "[17.14,17.15)" -property installationPath
          $version = & $vswhere -latest -products * -version "[17.14,17.15)" -property installationVersion
          if (-not $vsPath -or $version -ne "17.14.37614.0") { throw "TA16-V1 requires Visual Studio 2022 17.14.39 / installation 17.14.37614.0" }
          $msvcRoot = Join-Path $vsPath "VC\Tools\MSVC"
          $toolset = Get-ChildItem -Path $msvcRoot -Directory | Where-Object { $_.Name -like "14.44.*" } | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $toolset) { throw "TA16-V1 requires the MSVC v143 14.44 toolset family" }

      - name: Install and verify CMake 4.3.3
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "cmake-4.3.3-windows-x86_64.zip"
          $installRoot = Join-Path $env:RUNNER_TEMP "cmake-4.3.3"
          $url = "https://github.com/Kitware/CMake/releases/download/v4.3.3/cmake-4.3.3-windows-x86_64.zip"
          $expectedSha256 = "935ade9e5e8723583c07f44c5592cea2a1c8f65c56ca7e07b34c025c880e0bd6"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) { throw "CMake 4.3.3 archive SHA-256 mismatch" }
          Expand-Archive -Path $archive -DestinationPath $installRoot
          $cmakeBin = Join-Path $installRoot "cmake-4.3.3-windows-x86_64\bin"
          $cmakeExe = Join-Path $cmakeBin "cmake.exe"
          if ((& $cmakeExe --version | Select-Object -First 1) -ne "cmake version 4.3.3") { throw "TA16-V1 requires CMake 4.3.3" }
          $cmakeBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Bootstrap exact vcpkg baseline
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $root
          git -C $root checkout a1cae005c39be7b18ba319fced856b68d7276271
          $actual = git -C $root rev-parse HEAD
          if ($actual -ne "a1cae005c39be7b18ba319fced856b68d7276271") { throw "vcpkg baseline checkout mismatch" }
          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        shell: pwsh
        run: cmake --preset windows-msvc-debug

      - name: Build deterministic headless targets
        shell: pwsh
        run: cmake --build --preset windows-msvc-debug --target starforge-headless starforge_tests_domain --parallel

      - name: Require deterministic domain tests
        shell: pwsh
        run: >-
          cmake
          -DSTARFORGE_TEST_BUILD_DIR=${{ github.workspace }}/out/build/windows-msvc-debug
          -DSTARFORGE_TEST_LABEL=determinism
          -DSTARFORGE_TEST_CONFIG=Debug
          -P cmake/RequireTests.cmake

      - name: Run deterministic domain tests
        shell: pwsh
        run: ctest --test-dir .\out\build\windows-msvc-debug -C Debug -L determinism --output-on-failure

      - name: Prove headless worker-order equivalence
        shell: pwsh
        run: |
          $exe = ".\out\build\windows-msvc-debug\apps\headless\Debug\starforge-headless.exe"
          $one = (& $exe --workers=1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "headless run with workers=1 failed" }
          $two = (& $exe --workers=2 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "headless run with workers=2 failed" }
          $four = (& $exe --workers=4 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "headless run with workers=4 failed" }
          if ($one -ne $two -or $one -ne $four) {
            Write-Host "workers=1`n$one"
            Write-Host "workers=2`n$two"
            Write-Host "workers=4`n$four"
            throw "authoritative headless output changed with preparation worker count"
          }
          Write-Host $one

  ci-gate:
    name: StarForge / CI Gate
    if: ${{ always() }}
    needs: [build-unit, headless-determinism]
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Evaluate required implementation gates
        shell: bash
        run: |
          echo "Build & Unit result: ${{ needs.build-unit.result }}"
          echo "Headless Determinism result: ${{ needs.headless-determinism.result }}"
          test "${{ needs.build-unit.result }}" = "success"
          test "${{ needs.headless-determinism.result }}" = "success"
