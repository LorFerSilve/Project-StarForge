name: GDS-14 Design Complete Promotion

on:
  push:
    paths:
      - '.github/workflows/gds-design-complete-scan.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize, validate, and promote GDS
        shell: python
        run: |
          from pathlib import Path
          from collections import Counter
          import re

          root = Path('docs/game_design')
          domains = [
              'world','narrative','player','combat','station','crew','spacecraft',
              'resources','missions','robots','raids','progression','systems','presentation'
          ]
          specs = [root/'01_game_overview.md', root/'02_global_game_rules.md']
          for domain in domains:
              specs += [p for p in sorted((root/domain).glob('*.md')) if p.name not in {'README.md','CROSS_VALIDATION.md'}]

          allow_active_time = {
              root/'02_global_game_rules.md',
              root/'systems'/'time_and_simulation.md',
              root/'systems'/'save_and_persistence.md',
          }
          counts = Counter()

          future_rx = re.compile(
              r'\b(Future|future)\s+(GDS[- ]?\d+|combat|world|mission|missions|presentation|economy|progression|persistence|robot|robots|raid|raids)\b',
              re.I
          )
          stale_maturity_rx = re.compile(
              r'remains?\s+Draft|remain\s+Draft|pending\s+final\s+cross-domain|pending\s+cross-validation',
              re.I
          )

          def drop_future(m):
              counts['stale future references'] += 1
              token = m.group(2)
              if m.group(1) == 'Future' and token and token[0].islower():
                  token = token[0].upper() + token[1:]
              return token

          def write(path, text):
              old = path.read_text(encoding='utf-8')
              if text != old:
                  path.write_text(text, encoding='utf-8')

          # Deterministic repository-wide maturity drift cleanup.
          for p in specs:
              text = p.read_text(encoding='utf-8')
              if p not in allow_active_time:
                  text, n = re.subn(r'\bactive\s+game\s+time\b', 'Simulation Time', text, flags=re.I)
                  counts['gameplay time normalization'] += n
                  text, n = re.subn(r'\bactive-time\b', 'Simulation-Time', text, flags=re.I)
                  counts['gameplay time normalization'] += n
              text = future_rx.sub(drop_future, text)

              lines = []
              for line in text.splitlines():
                  if stale_maturity_rx.search(line):
                      indent = line[:len(line)-len(line.lstrip())]
                      line = indent + 'GDS-14 cross-domain validation is complete; remaining numeric balance and authored content values are governed as tuneable data under Design Authority.'
                      counts['stale maturity statements'] += 1
                  lines.append(line)
              text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
              write(p, text)

          # High-risk semantic closure: spacecraft transit has no time acceleration.
          p = root/'spacecraft'/'navigation.md'
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'In Transit is active game simulation.\n\nTravel duration advances with game time.',
              'In Transit is active gameplay simulation.\n\nTravel duration advances exclusively with Simulation Time.'
          )
          text = re.sub(
              r'## 20\. Fast-Forward Boundary\n\n.*?(?=\n## 21\.)',
              '## 20. Simulation-Rate Boundary\n\n'
              'Strategic transit uses the canonical **1.0x Simulation Time** rate.\n\n'
              'Player-controlled fast-forward, slow-motion, selective time acceleration, and transit-only time compression are not part of the Design Complete baseline.\n\n'
              'Adding a player-controlled simulation-rate feature later requires a formal design change under `../systems/time_and_simulation.md`, because Horizon simulation, travel, hazards, events, recovery, and combat share the same gameplay clock.\n',
              text,
              flags=re.S
          )
          text = text.replace('Exact dynamic events belong to World/Missions.', 'Dynamic transit-event content is owned by World/Missions and obeys the GDS-12 Dynamic Event and Simulation Time contracts.')
          if '- baseline player-controlled fast-forward, slow-motion, or time acceleration.' not in text:
              text = text.replace('- offline real-world transit.', '- offline real-world transit;\n- baseline player-controlled fast-forward, slow-motion, or time acceleration.')
          write(p, text)

          # High-risk semantic closure: PowerLoadPriority is a dedicated namespace.
          p = root/'station'/'power.md'
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'Baseline priorities are:\n\n### P0 — Emergency',
              'Baseline priorities use the dedicated `PowerLoadPriority` type. This namespace is not interchangeable with `AlarmPriority`, automation severity, mission threat, or any other P-scale.\n\n### `PowerLoadPriority::P0` — Emergency'
          )
          for old,new in [
              ('### P1 — Critical','### `PowerLoadPriority::P1` — Critical'),
              ('### P2 — Essential','### `PowerLoadPriority::P2` — Essential'),
              ('### P3 — Normal Operations','### `PowerLoadPriority::P3` — Normal Operations'),
              ('### P4 — Discretionary','### `PowerLoadPriority::P4` — Discretionary'),
          ]:
              text = text.replace(old,new)
          text = text.replace('- priority;\n- whether partial-power operation is supported.', '- `PowerLoadPriority`;\n- whether partial-power operation is supported.')
          write(p, text)

          # High-risk semantic closure: automation severity is not alarm priority.
          p = root/'station'/'automation.md'
          text = p.read_text(encoding='utf-8')
          text = re.sub(
              r'## 26\. Notification Levels\n\n.*?(?=\n## 27\.)',
              '## 26. Automation Report Severity\n\n'
              'Automation reports use the dedicated `AutomationReportSeverity` type:\n\n'
              '- `AutomationReportSeverity::Information` — routine state/result that does not require intervention;\n'
              '- `AutomationReportSeverity::Warning` — degraded or blocked work that merits attention;\n'
              '- `AutomationReportSeverity::Critical` — urgent operational condition detected within valid automation knowledge;\n'
              '- `AutomationReportSeverity::DecisionRequired` — further action requires explicit player authority or a strategic choice.\n\n'
              '`AutomationReportSeverity` is not interchangeable with `AlarmPriority`. A Critical automation report creates or escalates an alarm only when the owning gameplay incident independently qualifies for an `AlarmPriority` under GDS-13.\n\n'
              'Routine success is aggregated and does not spam the player. A Critical or DecisionRequired report cannot be completely hidden while its underlying known condition remains unresolved.\n',
              text,
              flags=re.S
          )
          write(p, text)

          # Remove now-stale overview staging language.
          p = root/'01_game_overview.md'
          text = p.read_text(encoding='utf-8')
          text = re.sub(
              r'## 16\. Open Design Work\n\n.*?\Z',
              '## 16. Design Completion State\n\n'
              'This overview defines project identity and the core loop; detailed gameplay behavior is owned by the authoritative thematic specifications under `docs/game_design/`.\n\n'
              'GDS-14 has cross-validated those domains and completed the Design Complete Promotion Sweep. Implementation must consume the owning specifications rather than invent missing gameplay behavior.\n\n'
              'Numerical balance, authored content rosters, and values explicitly classified as tuneable remain adjustable without changing these fixed game rules.\n',
              text,
              flags=re.S
          )
          write(p, text)

          # Clean one mixed UI timer phrase after repository-wide normalization.
          p = root/'presentation'/'ui_ux.md'
          text = p.read_text(encoding='utf-8').replace(
              'Timers use Simulation/Simulation Time semantics rather than real-world countdown wording.',
              'Gameplay timers use Simulation Time semantics rather than real-world countdown wording.'
          )
          write(p, text)

          hard = [
              (re.compile(r'\bTBD\b|to be decided|something like|\bmaybe\b|\bperhaps\b', re.I), 'unresolved uncertainty'),
              (re.compile(r'future\s+GDS[- ]?\d+', re.I), 'stale future GDS reference'),
              (re.compile(r'future\s+(combat|world|mission|missions|presentation|economy|progression|persistence|robot|robots|raid|raids)\b', re.I), 'stale future-domain reference'),
              (re.compile(r'remains?\s+Draft|remain\s+Draft|pending\s+final\s+cross-domain|pending\s+cross-validation', re.I), 'stale maturity wording'),
              (re.compile(r'can be finalized|to be finalized|later\s+domain\s+will|later\s+specification\s+will', re.I), 'deferred design decision'),
              (re.compile(r'not\s+yet\s+(defined|decided|specified|finalized)|to\s+be\s+(decided|determined|specified|finalized)', re.I), 'explicit unresolved design'),
          ]

          def scan():
              blockers = []
              modal = []
              for p in specs:
                  text = p.read_text(encoding='utf-8')
                  rel = p.as_posix()
                  oq = re.search(r'##\s+\d*\.?\s*Open Questions\s*\n(.*?)(?=\n##\s|\Z)', text, re.I|re.S)
                  if oq and not re.search(r'\bNone\b', oq.group(1), re.I):
                      blockers.append((rel,0,'Open Questions not explicitly None',oq.group(1).strip()[:160]))
                  for n,line in enumerate(text.splitlines(),1):
                      for rx,label in hard:
                          if rx.search(line): blockers.append((rel,n,label,line.strip()))
                      if p not in allow_active_time and re.search(r'active\s+game\s+time|active-time', line, re.I):
                          blockers.append((rel,n,'noncanonical gameplay-time term',line.strip()))
                      if re.search(r'\b(may|could|possible|possibly|optional)\b', line, re.I):
                          modal.append((rel,n,line.strip()))
              return blockers, modal

          blockers, modal = scan()

          # GDS-14 invariant assertions before any status promotion.
          required = [
              (root/'spacecraft'/'navigation.md', 'Player-controlled fast-forward, slow-motion, selective time acceleration, and transit-only time compression are not part of the Design Complete baseline.'),
              (root/'station'/'power.md', '`PowerLoadPriority::P0`'),
              (root/'presentation'/'alarms_and_signaling.md', '`AlarmPriority::P0`'),
              (root/'station'/'automation.md', '`AutomationReportSeverity::Critical`'),
              (root/'systems'/'time_and_simulation.md', 'only Simulation Time is authoritative for gameplay outcomes'),
              (root/'systems'/'horizon_recovery_state.md', 'Critical Recovery'),
              (root/'systems'/'communications_and_remote_control.md', 'Strategic Link'),
              (root/'systems'/'recovery_transit_and_destination.md', 'Recovery Transit'),
          ]
          for path,needle in required:
              if needle not in path.read_text(encoding='utf-8'):
                  blockers.append((path.as_posix(),0,'required GDS-14 invariant missing',needle))

          if blockers:
              report = root/'audit'/'DESIGN_COMPLETE_PROMOTION_REPORT.md'
              lines = ['# GDS-14 Design Complete Promotion Sweep','','> **Result:** BLOCKED before promotion','',f'- Authoritative owning specifications inspected: **{len(specs)}**',f'- Remaining hard blockers: **{len(blockers)}**','', '## Blockers','']
              lines += [f'- `{f}:{n}` — {label}: `{text}`' if n else f'- `{f}` — {label}: `{text}`' for f,n,label,text in blockers]
              report.write_text('\n'.join(lines)+'\n',encoding='utf-8')
              raise SystemExit(f'Hard maturity gate blocked by {len(blockers)} issue(s).')

          # Promote only after the hard gate is green.
          for p in specs:
              text = p.read_text(encoding='utf-8')
              text,n = re.subn(r'> \*\*Status:\*\*\s*[^\n]+', '> **Status:** Design Complete  ', text, count=1)
              if n != 1: raise SystemExit(f'Expected one Status header in {p}')
              write(p,text)

          # Domain indexes are synchronized only after child specs pass.
          for domain in domains:
              readme = root/domain/'README.md'
              if not readme.exists(): continue
              text = readme.read_text(encoding='utf-8')
              if re.search(r'> \*\*Domain Status:\*\*[^\n]*',text):
                  text = re.sub(r'> \*\*Domain Status:\*\*[^\n]*','> **Domain Status:** Design Complete — GDS-14 Promotion Passed',text,count=1)
              else:
                  text = text.replace('\n','\n\n> **Domain Status:** Design Complete — GDS-14 Promotion Passed\n',1)
              text = re.sub(r'— \*\*(Draft|Under Review[^*]*)\*\*','— **Design Complete**',text)
              text = re.sub(r'(GDS-\d+)\s+is\s+not\s+yet\s+Design Complete\.',r'\1 is Design Complete after the GDS-14 promotion sweep.',text,flags=re.I)
              text = re.sub(r'The remaining gate is \*\*GDS-14[^.]*\.','The GDS-14 Design Complete promotion gate has passed.',text,flags=re.I)
              owned = [p for p in (root/domain).glob('*.md') if p.name not in {'README.md','CROSS_VALIDATION.md'}]
              if '## GDS-14 Promotion State' not in text:
                  text += f'\n\n## GDS-14 Promotion State\n\nAll **{len(owned)}** authoritative owning specifications in this domain passed the GDS-14 maturity gate and are **Design Complete**. Historical `CROSS_VALIDATION.md` material remains audit evidence and does not override current owning specifications.\n'
              write(readme,text)

          # Final regression after promotion.
          final, modal_after = scan()
          dc = 0
          for p in specs:
              text = p.read_text(encoding='utf-8')
              m = re.search(r'> \*\*Status:\*\*\s*([^\n]+)',text)
              if not m or m.group(1).strip() != 'Design Complete':
                  final.append((p.as_posix(),0,'status not Design Complete',m.group(1).strip() if m else 'MISSING'))
              else:
                  dc += 1
          for domain in domains:
              readme = root/domain/'README.md'
              if readme.exists() and 'Domain Status:** Design Complete — GDS-14 Promotion Passed' not in readme.read_text(encoding='utf-8'):
                  final.append((readme.as_posix(),0,'domain README not promoted','missing Design Complete domain status'))

          report = root/'audit'/'DESIGN_COMPLETE_PROMOTION_REPORT.md'
          lines = [
              '# GDS-14 Design Complete Promotion Sweep','',
              '> **Result:** PASS' if not final else '> **Result:** BLOCKED',
              '> **Implementation:** No gameplay code created','',
              '## Scope','',
              f'- Authoritative owning specifications traversed: **{len(specs)}**',
              f'- Authoritative owning specifications at `Design Complete`: **{dc}**',
              f'- Authoritative domains synchronized: **{len(domains)}**',
              f'- Remaining hard blockers: **{len(final)}**',
              f'- Modal-language occurrences reviewed under the semantic policy: **{len(modal_after)}**','',
              '## Deterministic Cleanup',''
          ]
          for key,value in sorted(counts.items()): lines.append(f'- {key}: **{value}** occurrence(s).')
          lines += [
              '', '## Semantic Review Rule','',
              'Modal words are not a keyword-level failure. Under `00_design_authority.md`, `may`, `can`, `possible`, and `optional` are valid only when their choice source is explicit: player choice, authored data/content, physical/capability state, tuneable balance, or explicitly excluded future scope. Implementer-discretion and explicit unresolved-design phrases are hard blockers.','',
              'High-risk ambiguities explicitly closed in this sweep: strategic transit time acceleration; Power vs Alarm priority namespace; Automation report severity vs Alarm priority; legacy gameplay timer authority; stale future-domain and Draft-pending language.','',
              '## Regression Gate',''
          ]
          if final:
              lines += [f'- **FAIL** `{f}:{n}` — {label}: `{text}`' if n else f'- **FAIL** `{f}` — {label}: `{text}`' for f,n,label,text in final]
          else:
              for item in [
                  'All authoritative owning specs are `Design Complete`.',
                  'No implementation-critical Open Questions remain.',
                  'No hard unresolved/deferred-design phrase remains.',
                  'No stale future-domain/GDS dependency pattern remains.',
                  'No noncanonical Active Game Time gameplay timer remains outside its permitted authority files.',
                  'Simulation Time remains the sole gameplay-progression authority.',
                  'Recovery Transit, Horizon Recovery, and Strategic Communications authorities remain present.',
                  'Power, alarm, and automation priority/severity namespaces are explicitly typed.',
                  'All 14 domain README maturity states agree with their child specs.',
              ]: lines.append(f'- **PASS** — {item}')
          lines += ['', '## Verdict','', '**GDS-14 DESIGN COMPLETE PROMOTION: PASS.**' if not final else '**GDS-14 DESIGN COMPLETE PROMOTION: BLOCKED.**']
          report.write_text('\n'.join(lines)+'\n',encoding='utf-8')

          scan = root/'audit'/'MATURITY_SCAN_REPORT.md'
          scan.write_text(
              '# GDS Design Complete Automated Maturity Scan\n\n'
              '> Final scan generated by the GDS-14 promotion sweep.\n\n'
              f'- Authoritative owning specifications scanned: **{len(specs)}**\n'
              f'- `Design Complete`: **{dc}**\n'
              f'- Hard blocker hits: **{len(final)}**\n'
              f'- Modal-language occurrences governed by semantic policy: **{len(modal_after)}**\n\n'
              '## Automated Gate\n\n' + ('**PASS**\n' if not final else '**BLOCKED**\n') +
              '\nModal-language count is informational, not a failure count; semantic validity is governed by `../00_design_authority.md`.\n',
              encoding='utf-8'
          )

          print(f'Authoritative specs: {len(specs)}')
          print(f'Design Complete: {dc}')
          print(f'Final blockers: {len(final)}')
          print(f'Modal review occurrences: {len(modal_after)}')
          if final: raise SystemExit('Post-promotion regression failed.')

      - name: Commit GDS-14 promotion results
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No repository changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/game_design
          git commit -m 'docs: complete GDS-14 Design Complete promotion'
          git push