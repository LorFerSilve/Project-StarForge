name: GDS Design Complete Scan

on:
  push:
    paths:
      - '.github/workflows/gds-design-complete-scan.yml'

permissions:
  contents: write

jobs:
  maturity-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan authoritative specifications
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('docs/game_design')
          domains = {
              'world','narrative','player','combat','station','crew','spacecraft',
              'resources','missions','robots','raids','progression','systems','presentation'
          }
          authoritative = [root/'01_game_overview.md', root/'02_global_game_rules.md']
          for d in sorted(domains):
              for p in sorted((root/d).glob('*.md')):
                  if p.name not in {'README.md','CROSS_VALIDATION.md'}:
                      authoritative.append(p)

          hard_patterns = [
              (re.compile(r'\bTBD\b|to be decided|something like|\bmaybe\b|\bperhaps\b', re.I), 'unresolved uncertainty'),
              (re.compile(r'future\s+GDS[- ]?\d+', re.I), 'stale future GDS reference'),
              (re.compile(r'future\s+(combat|world|mission|missions|presentation|economy|progression|persistence|robot|robots|raid|raids)\b', re.I), 'stale future-domain reference'),
              (re.compile(r'remains?\s+Draft|remain\s+Draft|pending\s+final\s+cross-domain|pending\s+cross-validation', re.I), 'stale maturity wording'),
              (re.compile(r'can be finalized|to be finalized|later\s+domain\s+will|later\s+specification\s+will', re.I), 'deferred design decision'),
          ]

          active_time_allow = {
              root/'systems'/'time_and_simulation.md',
              root/'systems'/'save_and_persistence.md',
          }

          lines = []
          blockers = []
          review = []
          statuses = {}
          for p in authoritative:
              txt = p.read_text(encoding='utf-8')
              rel = p.as_posix()
              m = re.search(r'> \*\*Status:\*\*\s*([^\n]+)', txt)
              statuses[rel] = m.group(1).strip() if m else 'MISSING'
              oq = re.search(r'##\s+\d*\.?\s*Open Questions\s*\n(.*?)(?=\n##\s|\Z)', txt, re.I|re.S)
              if oq and not re.search(r'\bNone\b', oq.group(1), re.I):
                  blockers.append((rel, 0, 'Open Questions not explicitly None', oq.group(1).strip()[:180]))
              for n, line in enumerate(txt.splitlines(), 1):
                  for rx, label in hard_patterns:
                      if rx.search(line):
                          blockers.append((rel,n,label,line.strip()))
                  if 'Active Game Time' in line and p not in active_time_allow:
                      blockers.append((rel,n,'Active Game Time outside canonical allowed files',line.strip()))
                  if re.search(r'\b(may|could|possible|possibly|optional)\b', line, re.I):
                      review.append((rel,n,line.strip()))

          lines.append('# GDS Design Complete Automated Maturity Scan')
          lines.append('')
          lines.append('> Generated by the temporary documentation-only promotion workflow.')
          lines.append('')
          lines.append(f'- Authoritative owning specifications scanned: **{len(authoritative)}**')
          lines.append(f'- Hard blocker hits: **{len(blockers)}**')
          lines.append(f'- Human semantic-review candidates (`may/could/possible/optional`): **{len(review)}**')
          lines.append('')
          lines.append('## Status Inventory')
          lines.append('')
          for k,v in sorted(statuses.items()):
              lines.append(f'- `{k}` — **{v}**')
          lines.append('')
          lines.append('## Hard Blocker Hits')
          lines.append('')
          if blockers:
              for f,n,label,text in blockers:
                  loc=f'{f}:{n}' if n else f
                  lines.append(f'- `{loc}` — {label}: `{text}`')
          else:
              lines.append('None.')
          lines.append('')
          lines.append('## Semantic Review Candidates')
          lines.append('')
          if review:
              for f,n,text in review:
                  lines.append(f'- `{f}:{n}` — `{text}`')
          else:
              lines.append('None.')
          lines.append('')
          lines.append('## Automated Gate')
          lines.append('')
          lines.append('**PASS**' if not blockers else '**BLOCKED — resolve hard hits before bulk promotion.**')

          report = root/'audit'/'MATURITY_SCAN_REPORT.md'
          report.write_text('\n'.join(lines)+'\n', encoding='utf-8')
          print(f'Scanned {len(authoritative)} authoritative specifications.')
          print(f'Hard blocker hits: {len(blockers)}')
          print(f'Semantic review candidates: {len(review)}')
          print(f'Full report written to {report}')

      - name: Commit scan report
        run: |
          if [ -z "$(git status --porcelain -- docs/game_design/audit/MATURITY_SCAN_REPORT.md)" ]; then
            echo 'Report unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/game_design/audit/MATURITY_SCAN_REPORT.md
          git commit -m 'docs: update GDS maturity scan report'
          git push
